<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e91e63" />
    <title>Offline - Kizomba AI DJ</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: #0a0a0f;
        color: #e0e0e0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .offline-container {
        text-align: center;
        max-width: 400px;
      }
      .offline-icon {
        font-size: 64px;
        margin-bottom: 24px;
        opacity: 0.6;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        background: linear-gradient(135deg, #e91e63, #00bcd4);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 12px;
      }
      p {
        color: #888;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      .retry-btn {
        background: #e91e63;
        color: white;
        border: none;
        padding: 12px 32px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      .retry-btn:hover { background: #c2185b; }
      .retry-btn:active { background: #ad1457; }
    </style>
  </head>
  <body>
    <div class="offline-container">
      <div class="offline-icon">📡</div>
      <h1>Du är offline</h1>
      <p>Kizomba AI DJ kunde inte ladda den här sidan. Kontrollera din internetanslutning och försök igen.</p>
      <button class="retry-btn" onclick="window.location.reload()">Försök igen</button>
    </div>
  </body>
</html>
