<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskable: safe zone is inner 80%, so content centered with padding -->
  <rect width="512" height="512" fill="#0a0a0f"/>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e91e63"/>
      <stop offset="100%" stop-color="#00bcd4"/>
    </linearGradient>
  </defs>
  <!-- Vinyl record - centered in safe zone -->
  <circle cx="256" cy="230" r="120" fill="none" stroke="url(#g)" stroke-width="8"/>
  <circle cx="256" cy="230" r="85" fill="none" stroke="url(#g)" stroke-width="4" opacity="0.5"/>
  <circle cx="256" cy="230" r="50" fill="none" stroke="url(#g)" stroke-width="3" opacity="0.3"/>
  <circle cx="256" cy="230" r="18" fill="url(#g)"/>
  <!-- AI text -->
  <text x="256" y="400" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="60" fill="url(#g)">AI DJ</text>
</svg>
